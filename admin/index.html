<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>FixGo Admin</title>
<style>
  /* โทนเดียวกับแอป: พื้นเทาอ่อน การ์ดขาวมุมโค้ง ส้ม FixGo เป็นสีปุ่ม action */
  :root {
    --navy: #1D2330;
    --accent: #F26B1D;
    --accent-active: #D9560A;
    --accent-soft: #FFF1E7;
    --surface: #F5F6F8;
    --text-secondary: #6B7280;
    --border: #E8EAEE;
    --success: #16A34A;
    --error: #DC2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--surface);
    color: var(--navy);
  }
  header {
    background: #fff;
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 1;
  }
  header .logo {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, #FF8A2B, #E8480C);
    display: grid; place-items: center; color: #fff;
  }
  header h1 { margin: 0; font-size: 20px; font-weight: 800; }
  header .sub {
    font-size: 13px; color: var(--text-secondary);
    background: var(--surface); padding: 4px 10px; border-radius: 999px;
  }
  main { padding: 24px; max-width: 1100px; margin: 0 auto; }
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 4px 16px rgba(29, 35, 48, 0.06);
  }
  h2 { font-size: 17px; margin: 0 0 16px; }
  input {
    padding: 12px 14px;
    border: 1px solid transparent;
    background: var(--surface);
    border-radius: 14px;
    font-size: 15px;
    width: 100%;
    max-width: 280px;
    font-family: inherit;
  }
  input:focus { outline: none; border-color: var(--accent); background: #fff; }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 10px 18px;
    font-weight: 700;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
  }
  button:hover { background: var(--accent-active); }
  button.ghost {
    background: transparent;
    color: var(--navy);
    border: 1px solid var(--border);
  }
  button.ghost:hover { background: var(--surface); }
  button.danger { background: #fff; color: var(--error); border: 1px solid rgba(220, 38, 38, 0.35); }
  button.danger:hover { background: #FEF2F2; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 12px 10px; border-bottom: 1px solid var(--border); }
  tbody tr:hover { background: #FAFAFB; }
  th { color: var(--text-secondary); font-weight: 600; font-size: 13px; }
  .stats { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
  .stat {
    background: var(--surface);
    border-radius: 16px;
    padding: 16px;
  }
  .stat:first-child { background: linear-gradient(135deg, #FF8A3D, #E0500C); }
  .stat:first-child .value, .stat:first-child .label { color: #fff; }
  .stat .value { font-size: 26px; font-weight: 800; color: var(--navy); }
  .stat .label { font-size: 13px; color: var(--text-secondary); }
  .hidden { display: none; }
  .error { color: var(--error); margin-top: 12px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M12 2C7.6 2 4 5.4 4 9.7 4 15 11 21.4 11.3 21.7a1 1 0 0 0 1.4 0C13 21.4 20 15 20 9.7 20 5.4 16.4 2 12 2Z"/></svg>
  </div>
  <h1>FixGo</h1>
  <span class="sub">ระบบหลังบ้าน</span>
  <span style="flex:1"></span>
  <button id="logout" class="ghost hidden">ออกจากระบบ</button>
</header>

<main>
  <section id="login-view" class="card">
    <h2>เข้าสู่ระบบผู้ดูแล</h2>
    <div class="row">
      <input id="phone" placeholder="เบอร์โทรศัพท์" inputmode="numeric" autocomplete="username">
      <input id="password" type="password" placeholder="รหัสผ่าน" autocomplete="current-password">
      <button id="login-btn">เข้าสู่ระบบ</button>
    </div>
    <div id="login-error" class="error"></div>
  </section>

  <div id="dashboard-view" class="hidden">
    <div class="card">
      <h2>ภาพรวม</h2>
      <div class="stats" id="stats"></div>
    </div>

    <div class="card">
      <h2>ช่างรออนุมัติ</h2>
      <div class="table-wrap"><table><thead><tr>
        <th>ชื่อ</th><th>เบอร์</th><th>ร้าน/อู่</th><th>เฟซบุ๊ก</th><th>เวลาทำงาน</th><th></th>
      </tr></thead><tbody id="providers-body"></tbody></table></div>
    </div>

    <div class="card">
      <h2>คำขอเบิกเงิน</h2>
      <div class="table-wrap"><table><thead><tr>
        <th>ช่าง</th><th>จำนวน</th><th>บัญชีรับเงิน</th><th>ขอเมื่อ</th><th></th>
      </tr></thead><tbody id="withdrawals-body"></tbody></table></div>
    </div>

    <div class="card">
      <h2>ออเดอร์ล่าสุด</h2>
      <div class="table-wrap"><table><thead><tr>
        <th>เลขที่</th><th>บริการ</th><th>ลูกค้า</th><th>ช่าง</th><th>สถานะ</th><th>ราคา</th>
      </tr></thead><tbody id="orders-body"></tbody></table></div>
    </div>
  </div>
</main>

<script>
// ตั้งค่า API ปลายทาง — เปลี่ยนเป็น URL จริงตอน deploy
// production: หน้าแอดมินอยู่ที่ admin.<โดเมน> และ API อยู่ที่ api.<โดเมน> (ดู deploy/Caddyfile)
// ตั้ง localStorage fixgo_api_base เพื่อชี้ไปที่อื่นได้
const API_BASE = localStorage.getItem('fixgo_api_base') || (
  location.hostname.startsWith('admin.')
    ? `${location.protocol}//api.${location.hostname.slice('admin.'.length)}`
    : 'http://localhost:3000'
);

// เก็บโทเคนเฉพาะแท็บปัจจุบัน ลดความเสี่ยงจากโทเคนค้างบนเครื่องสาธารณะ
let token = sessionStorage.getItem('fixgo_admin_token');

const el = (id) => document.getElementById(id);
const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (char) => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;',
})[char]);

const STATUS_LABELS = {
  CREATED: 'สร้างแล้ว', SEARCHING: 'กำลังหาช่าง', MATCHED: 'ช่างรับแล้ว',
  EN_ROUTE: 'กำลังเดินทาง', IN_PROGRESS: 'กำลังซ่อม', COMPLETED: 'เสร็จสิ้น',
  CANCELLED: 'ยกเลิก', NO_MATCH: 'ไม่มีช่างรับ',
};

const formatSatang = (satang) =>
  '฿' + (satang / 100).toLocaleString('th-TH', { maximumFractionDigits: 2 });

const formatMinute = (minute) =>
  String(Math.floor(minute / 60)).padStart(2, '0') + ':' +
  String(minute % 60).padStart(2, '0');

async function api(path, options = {}) {
  const response = await fetch(API_BASE + '/api' + path, {
    ...options,
    headers: {
      'Content-Type': 'application/json',
      ...(token ? { Authorization: 'Bearer ' + token } : {}),
      ...(options.headers || {}),
    },
  });
  if (!response.ok) {
    let message = 'เกิดข้อผิดพลาด (' + response.status + ')';
    try {
      const body = await response.json();
      if (body.message) message = Array.isArray(body.message) ? body.message.join(', ') : body.message;
    } catch (_) { /* ไม่ใช่ JSON */ }
    throw new Error(message);
  }
  return response.status === 204 ? null : response.json();
}

async function login() {
  el('login-error').textContent = '';
  try {
    const result = await api('/admin/login', {
      method: 'POST',
      body: JSON.stringify({
        phone: el('phone').value.trim(),
        password: el('password').value,
      }),
    });
    token = result.accessToken;
    sessionStorage.setItem('fixgo_admin_token', token);
    showDashboard();
  } catch (error) {
    el('login-error').textContent = error.message;
  }
}

function logout() {
  token = null;
  sessionStorage.removeItem('fixgo_admin_token');
  el('dashboard-view').classList.add('hidden');
  el('login-view').classList.remove('hidden');
  el('logout').classList.add('hidden');
}

async function showDashboard() {
  el('login-view').classList.add('hidden');
  el('dashboard-view').classList.remove('hidden');
  el('logout').classList.remove('hidden');
  await Promise.all([loadSummary(), loadProviders(), loadWithdrawals(), loadOrders()]);
}

async function loadSummary() {
  const summary = await api('/admin/summary');
  el('stats').innerHTML = [
    { label: 'ออเดอร์ทั้งหมด', value: summary.orderCount },
    { label: 'งานที่เสร็จแล้ว', value: summary.completedCount },
    { label: 'รายได้ค่าธรรมเนียม', value: formatSatang(summary.commissionRevenue) },
    { label: 'ช่างรออนุมัติ', value: summary.pendingProviders },
    { label: 'คำขอเบิกค้าง', value: summary.pendingWithdrawals },
  ].map((stat) => `<div class="stat"><div class="value">${escapeHtml(stat.value)}</div><div class="label">${escapeHtml(stat.label)}</div></div>`).join('');
}

async function loadProviders() {
  const providers = await api('/admin/providers?status=PENDING');
  el('providers-body').innerHTML = providers.length === 0
    ? '<tr><td colspan="6">ไม่มีช่างรออนุมัติ</td></tr>'
    : providers.map((provider) => `
      <tr>
        <td>${escapeHtml(provider.realName)} (${escapeHtml(provider.nickname)})<br><small>ประสบการณ์ ${escapeHtml(provider.experienceYears)} ปี</small></td>
        <td>${escapeHtml(provider.phone)}</td>
        <td>${escapeHtml(provider.shopName || '-')}</td>
        <td>${escapeHtml(provider.facebookPage || '-')}</td>
        <td>${escapeHtml(formatMinute(provider.openMinute))}-${escapeHtml(formatMinute(provider.closeMinute))}</td>
        <td>
          <button onclick="setProviderStatus('${provider.id}','VERIFIED')">อนุมัติ</button>
          <button class="danger" onclick="setProviderStatus('${provider.id}','SUSPENDED')">ปฏิเสธ</button>
        </td>
      </tr>`).join('');
}

async function setProviderStatus(id, status) {
  await api('/admin/providers/' + id + '/status', {
    method: 'PATCH',
    body: JSON.stringify({ status }),
  });
  await Promise.all([loadProviders(), loadSummary()]);
}

async function loadWithdrawals() {
  const withdrawals = await api('/admin/withdrawals?status=REQUESTED');
  el('withdrawals-body').innerHTML = withdrawals.length === 0
    ? '<tr><td colspan="5">ไม่มีคำขอเบิกเงิน</td></tr>'
    : withdrawals.map((withdrawal) => `
      <tr>
        <td>${escapeHtml(withdrawal.provider.realName)} (${escapeHtml(withdrawal.provider.nickname)})<br><small>${escapeHtml(withdrawal.provider.phone)}</small></td>
        <td><strong>${escapeHtml(formatSatang(withdrawal.amount))}</strong></td>
        <td>${escapeHtml(withdrawal.promptPayId ? 'พร้อมเพย์ ' + withdrawal.promptPayId : (withdrawal.bankName || '') + ' ' + (withdrawal.bankAccountNumber || ''))}<br><small>${escapeHtml(withdrawal.bankAccountName || '')}</small></td>
        <td>${escapeHtml(new Date(withdrawal.requestedAt).toLocaleString('th-TH'))}</td>
        <td>
          <button onclick="resolveWithdrawal('${withdrawal.id}','transferred')">โอนแล้ว</button>
          <button class="danger" onclick="resolveWithdrawal('${withdrawal.id}','reject')">ปฏิเสธ</button>
        </td>
      </tr>`).join('');
}

async function resolveWithdrawal(id, action) {
  const note = prompt(action === 'reject' ? 'เหตุผลที่ปฏิเสธ' : 'หมายเหตุ (ไม่บังคับ)') || undefined;
  if (action === 'reject' && note === undefined) return;
  await api('/admin/withdrawals/' + id + '/' + action, {
    method: 'POST',
    body: JSON.stringify({ note }),
  });
  await Promise.all([loadWithdrawals(), loadSummary()]);
}

async function loadOrders() {
  const orders = await api('/admin/orders');
  el('orders-body').innerHTML = orders.slice(0, 30).map((order) => `
    <tr>
      <td>${escapeHtml(order.orderNo)}</td>
      <td>${escapeHtml(order.subService?.name || order.category?.name || '-')}</td>
      <td>${escapeHtml(order.customer?.phone || '-')}</td>
      <td>${escapeHtml(order.provider ? order.provider.nickname : '-')}</td>
      <td>${escapeHtml(STATUS_LABELS[order.status] || order.status)}</td>
      <td>${escapeHtml(formatSatang(order.priceFinal ?? order.priceEstimated))}</td>
    </tr>`).join('') || '<tr><td colspan="6">ยังไม่มีออเดอร์</td></tr>';
}

el('login-btn').addEventListener('click', login);
el('logout').addEventListener('click', logout);
el('password').addEventListener('keydown', (event) => {
  if (event.key === 'Enter') login();
});

if (token) {
  showDashboard().catch(() => logout());
}
</script>
</body>
</html>
