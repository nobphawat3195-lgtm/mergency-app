# FixGo production บน VPS เครื่องเดียว: API + PostgreSQL + Caddy (HTTPS อัตโนมัติ)
# Caddy เสิร์ฟเว็บแอปลูกค้า, เว็บแอปช่าง และหน้าแอดมินด้วย
# วิธีใช้ดู docs/DEPLOY.md
#   cp deploy/.env.production.example deploy/.env.production   แล้วกรอกค่า
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env.production up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fixgo
      POSTGRES_USER: fixgo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ต้องตั้ง POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixgo -d fixgo"]
      interval: 10s
      timeout: 5s
      retries: 5
    # ไม่เปิดพอร์ต DB ออกนอกเครื่อง

  api:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://fixgo:${POSTGRES_PASSWORD}@db:5432/fixgo?schema=public
      UPLOAD_DIR: /data/uploads
    volumes:
      # รูปที่อัปโหลดเมื่อตั้ง STORAGE_PROVIDER=local
      - uploads:/data/uploads
    expose:
      - "3000"

  caddy:
    # อิมเมจ Caddy ที่มีเว็บแอปลูกค้า (/srv/web) และแอปช่าง (/srv/fixer) build ไว้แล้ว
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        API_BASE_URL: https://${API_DOMAIN}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?ต้องตั้ง API_DOMAIN เช่น api.fixgo.co.th}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?ต้องตั้ง ADMIN_DOMAIN เช่น admin.fixgo.co.th}
      WEB_DOMAIN: ${WEB_DOMAIN:?ต้องตั้ง WEB_DOMAIN เช่น fixgo.co.th}
      FIXER_DOMAIN: ${FIXER_DOMAIN:?ต้องตั้ง FIXER_DOMAIN เช่น fixer.fixgo.co.th}
      # เบอร์โทรบนหน้าแรกของเว็บลูกค้า (ว่างไว้ = ไม่แสดงปุ่มโทร)
      LEGAL_CONTACT_PHONE: ${LEGAL_CONTACT_PHONE:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../admin:/srv/admin:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
