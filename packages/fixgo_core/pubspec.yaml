name: fixgo_core
description: ธีม โมเดล และ API client ที่ใช้ร่วมกันระหว่างแอปลูกค้าและแอปช่าง FixGo
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  intl: ^0.19.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  assets:
    - assets/icons/
    - assets/brand/
    - assets/guides/
  # ต้องมีไฟล์จริงทุกน้ำหนักที่ใช้ ไม่งั้น Flutter จะสังเคราะห์ตัวหนาเอง (faux bold)
  # ทำให้สระ/วรรณยุกต์ไทยหนาไม่เท่ากันและดูแตก
  fonts:
    - family: NotoSansThai
      fonts:
        - asset: assets/fonts/NotoSansThai-Regular.ttf
        - asset: assets/fonts/NotoSansThai-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansThai-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansThai-Bold.ttf
          weight: 700
        - asset: assets/fonts/NotoSansThai-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/NotoSansThai-ExtraBold.ttf
          weight: 900
