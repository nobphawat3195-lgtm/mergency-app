<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FixGo Fixer แอปช่าง รับงานช่วยเหลือรถใกล้คุณ">
  <meta name="theme-color" content="#122821">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="FixGo Fixer">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FixGo Fixer</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    ฉากเปิดแอปช่าง: โลโก้เด้งขึ้นพร้อมวงคลื่นสีมะนาว เครื่องมือหมุนเข้ามา และแถบโหลด
    ซ่อนเมื่อแอป Flutter วาดเฟรมแรกเสร็จ (event flutter-first-frame)
  -->
  <style>
    html, body { margin: 0; background: #122821; }
    #splash { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 14px; background: radial-gradient(circle at 50% 42%, #1D3F33 0%, #122821 62%);
      color: #fff; font-family: "Noto Sans Thai", "Sukhumvit Set", "Leelawadee UI", Tahoma, sans-serif; }
    #splash.leaving { opacity: 0; transition: opacity .35s ease; pointer-events: none; }
    #splash[hidden] { display: none; }
    #splash .stage { position: relative; width: 132px; height: 132px; }
    #splash .logo { position: absolute; inset: 22px; width: 88px; height: 88px; border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,.35); animation: fx-pop .6s cubic-bezier(.3,1.5,.5,1) both; }
    #splash .wave { position: absolute; inset: 22px; border-radius: 28px; border: 3px solid #C7EE77; opacity: 0;
      animation: fx-wave 1.8s ease-out .5s infinite; }
    #splash .tool { position: absolute; width: 44px; height: 44px; animation: fx-fly .7s cubic-bezier(.2,.9,.3,1.2) both; }
    #splash .tool.a { right: -14px; top: -6px; animation-delay: .45s; }
    #splash .tool.b { left: -14px; bottom: -4px; animation-delay: .6s; --from: -40px; }
    #splash h1 { margin: 6px 0 0; font-size: 24px; font-weight: 800; letter-spacing: .5px;
      animation: fx-rise .5s ease-out .7s both; }
    #splash h1 span { color: #C7EE77; }
    #splash p { margin: 0; font-size: 14px; color: #C9DDD4; animation: fx-rise .5s ease-out .85s both; }
    #splash .bar { width: 160px; height: 4px; margin-top: 10px; border-radius: 4px; overflow: hidden;
      background: rgba(255,255,255,.12); }
    #splash .bar i { display: block; width: 40%; height: 100%; border-radius: 4px; background: #C7EE77;
      animation: fx-load 1.1s ease-in-out infinite; }
    @keyframes fx-pop { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes fx-wave { from { transform: scale(1); opacity: .8; } to { transform: scale(1.7); opacity: 0; } }
    @keyframes fx-fly { from { transform: translateX(var(--from, 40px)) rotate(-120deg) scale(.4); opacity: 0; }
      to { transform: none; opacity: 1; } }
    @keyframes fx-rise { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes fx-load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-reduced-motion: reduce) {
      #splash *, #splash.leaving { animation: none !important; transition: none !important; }
    }
  </style>
  <div id="splash" role="status" aria-busy="true">
    <div class="stage" aria-hidden="true">
      <span class="wave"></span>
      <img class="logo" src="icons/Icon-192.png" alt="" width="88" height="88">
      <img class="tool a" src="assets/packages/fixgo_core/assets/icons/ui/repair.png" alt="" width="44" height="44">
      <img class="tool b" src="assets/packages/fixgo_core/assets/icons/technician.png" alt="" width="44" height="44">
    </div>
    <h1>FixGo <span>Fixer</span></h1>
    <p>กำลังเปิดแอปช่าง...</p>
    <div class="bar" aria-hidden="true"><i></i></div>
  </div>
  <script>
    (function () {
      var splash = document.getElementById('splash');
      var startedAt = Date.now();
      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      // ถ้าแอปโหลดเร็วมาก ให้ฉากเปิดเล่นจบก่อนราว 1.3 วินาที แล้วค่อยจางออก
      var minShowMs = reduceMotion ? 0 : 1300;
      window.addEventListener('flutter-first-frame', function () {
        setTimeout(function () {
          splash.setAttribute('aria-busy', 'false');
          splash.classList.add('leaving');
          setTimeout(function () { splash.hidden = true; }, reduceMotion ? 0 : 380);
        }, Math.max(0, minShowMs - (Date.now() - startedAt)));
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
