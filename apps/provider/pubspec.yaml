name: fixgo_provider
description: FixGo ช่าง — แอปสำหรับช่างรับงานซ่อมรถ
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  fixgo_core:
    path: ../../packages/fixgo_core
  cupertino_icons: ^1.0.8
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  audioplayers: ^6.8.1
  flutter_local_notifications: ^22.3.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    # เสียงปลุกตอนมีงานใหม่ (สังเคราะห์เอง ไม่มีลิขสิทธิ์ผู้อื่น)
    - assets/sounds/
