<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <!--
    หน้าติดตามงานที่ลูกค้าแชร์ให้ครอบครัว: /track/<token> (Caddy rewrite มาที่ไฟล์นี้)
    เป็น HTML ธรรมดา โหลดเร็วกว่าแอป Flutter เต็มตัว ไม่ต้องล็อกอิน
    ค่า {{env "API_DOMAIN"}} ถูกแทนโดย Caddy templates บนเซิร์ฟเวอร์ ถ้าเปิดตรงๆ ตอนพัฒนาใช้ ?api=http://localhost:3000
  -->
  <meta name="fixgo-api" content="https://{{env "API_DOMAIN"}}">
  <title>ติดตามช่าง FixGo</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <style>
    :root { --ink: #122821; --accent: #0B5F45; --jade: #16A37B; --soft: #ECF8F1;
      --line: #D5E8DE; --muted: #4A6259; --lime: #C7EE77; --error: #C62828; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--soft); color: var(--ink);
      font-family: "Noto Sans Thai", "Sukhumvit Set", "Leelawadee UI", Tahoma, sans-serif; line-height: 1.5; }
    header { background: linear-gradient(135deg, #0B5F45, #084A36); color: #fff; padding: 14px 16px; }
    header b { font-size: 20px; } header b span { color: var(--lime); }
    header p { margin: 2px 0 0; font-size: 13px; opacity: .85; }
    main { max-width: 560px; margin: 0 auto; padding: 16px; }
    .card { background: #fff; border-radius: 18px; padding: 16px; margin-bottom: 14px;
      box-shadow: 0 6px 20px rgba(18, 40, 33, .08); }
    .status { font-size: 24px; font-weight: 800; color: var(--accent); margin: 0; }
    .muted { color: var(--muted); font-size: 14px; }
    .eta { background: var(--soft); border-radius: 12px; padding: 10px 12px; margin-top: 12px; }
    .eta b { font-size: 18px; }
    #map { height: 260px; border-radius: 14px; margin-top: 12px; z-index: 0; }
    .row { display: flex; gap: 12px; align-items: center; }
    .avatar { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; background: var(--soft); flex: none; }
    .badge { display: inline-block; font-size: 12px; font-weight: 700; color: #0E7A57;
      background: var(--soft); border-radius: 99px; padding: 2px 8px; margin-top: 4px; }
    .plate { border: 2px solid var(--ink); border-radius: 6px; padding: 2px 10px; font-weight: 800;
      background: #fff; white-space: nowrap; }
    .sos a { display: block; text-align: center; text-decoration: none; font-weight: 800; border-radius: 99px;
      padding: 12px; margin-top: 8px; }
    .sos .red { background: var(--error); color: #fff; }
    .sos .out { border: 2px solid var(--error); color: var(--error); }
    .pin { width: 20px; height: 20px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 1px 6px rgba(0,0,0,.35); }
    .pin.me { background: var(--error); } .pin.mech { background: var(--accent); width: 24px; height: 24px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <b>Fix<span>Go</span></b>
    <p>ลิงก์ติดตามงานที่ส่งมาจากคนที่คุณรู้จัก ดูได้อย่างเดียว</p>
  </header>
  <main>
    <div class="card" id="loading"><p class="muted">กำลังโหลดข้อมูล…</p></div>
    <div class="card" id="error" hidden>
      <p class="status" style="color: var(--error)">เปิดลิงก์ไม่ได้</p>
      <p class="muted" id="error-text"></p>
    </div>

    <div id="content" hidden>
      <div class="card">
        <p class="muted" id="service"></p>
        <p class="status" id="status"></p>
        <div class="eta" id="eta" hidden><b id="eta-text"></b><div class="muted" id="eta-sub"></div></div>
        <div id="map"></div>
        <p class="muted" style="margin: 8px 0 0">หมุดแดง = จุดที่รถเสีย · หมุดเขียว = ช่าง · อัปเดตอัตโนมัติ</p>
      </div>

      <div class="card" id="provider" hidden>
        <div class="row">
          <img class="avatar" id="p-photo" alt="" src="/icons/Icon-192.png">
          <div style="flex: 1">
            <b id="p-name"></b><br>
            <span class="muted" id="p-stats"></span><br>
            <span class="badge" id="p-verified" hidden>✓ FixGo ตรวจสอบตัวตนแล้ว</span>
          </div>
        </div>
        <div class="row" id="p-vehicle-row" style="margin-top: 12px" hidden>
          <span class="muted" style="flex: 1" id="p-vehicle"></span>
          <span class="plate" id="p-plate" hidden></span>
        </div>
      </div>

      <div class="card sos">
        <b>ถ้าเกิดเหตุฉุกเฉิน</b>
        <a class="red" href="tel:191">แจ้งเหตุด่วน โทร 191</a>
        <a class="out" href="tel:1669">เจ็บป่วยฉุกเฉิน โทร 1669</a>
        <a class="out" href="tel:1586">เหตุบนทางหลวง โทร 1586</a>
      </div>
    </div>
  </main>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script>
    (function () {
      var STATUS = {
        CREATED: 'กำลังหาช่าง', SEARCHING: 'กำลังหาช่าง', MATCHED: 'ช่างรับงานแล้ว',
        EN_ROUTE: 'ช่างกำลังเดินทาง', IN_PROGRESS: 'ช่างถึงแล้ว กำลังซ่อม',
        COMPLETED: 'ซ่อมเสร็จเรียบร้อย', CANCELLED: 'งานนี้ถูกยกเลิก', NO_MATCH: 'ทีมงานกำลังหาช่างให้'
      };
      var meta = document.querySelector('meta[name="fixgo-api"]').content;
      var override = new URLSearchParams(location.search).get('api');
      // ?api= ใช้ได้เฉพาะตอนพัฒนา (ไฟล์ยังไม่ผ่าน Caddy templates) กันคนทำลิงก์ชี้ไป API ปลอม
      var api = /\{\{/.test(meta) ? (override || 'http://localhost:3000') : meta;
      var token = location.pathname.split('/').filter(Boolean).pop() || '';
      var $ = function (id) { return document.getElementById(id); };
      var map, meMarker, mechMarker, fitted = false, timer;

      function pin(cls) {
        return L.divIcon({ className: '', html: '<div class="pin ' + cls + '"></div>', iconSize: [24, 24], iconAnchor: [12, 12] });
      }

      function minutesAgo(iso) {
        var m = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
        return m < 1 ? 'เมื่อสักครู่' : m + ' นาทีที่แล้ว';
      }

      function showError(text) {
        $('loading').hidden = true; $('content').hidden = true;
        $('error').hidden = false; $('error-text').textContent = text;
        clearInterval(timer);
      }

      function render(d) {
        $('loading').hidden = true; $('error').hidden = true; $('content').hidden = false;
        $('service').textContent = d.categoryName + ' · ' + d.subServiceName;
        $('status').textContent = STATUS[d.status] || d.status;

        var p = d.provider;
        var live = p && p.currentLat != null && p.currentLng != null;
        $('eta').hidden = !(live && p.etaMinutes != null);
        if (live && p.etaMinutes != null) {
          $('eta-text').textContent = 'ช่างจะถึงในอีกราว ' + p.etaMinutes + ' นาที';
          $('eta-sub').textContent = 'ห่าง ' + p.distanceKm.toFixed(1) + ' กม. · อัปเดต ' + minutesAgo(p.locationUpdatedAt);
        }

        var pickup = [d.pickup.lat, d.pickup.lng];
        if (!map) {
          map = L.map('map', { zoomControl: false, attributionControl: true }).setView(pickup, 15);
          L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
          }).addTo(map);
          meMarker = L.marker(pickup, { icon: pin('me'), title: 'จุดที่รถเสีย' }).addTo(map);
        }
        if (live) {
          var here = [p.currentLat, p.currentLng];
          if (!mechMarker) mechMarker = L.marker(here, { icon: pin('mech'), title: 'ช่าง' }).addTo(map);
          else mechMarker.setLatLng(here);
          if (!fitted) { map.fitBounds([pickup, here], { padding: [40, 40], maxZoom: 16 }); fitted = true; }
        } else if (mechMarker) {
          map.removeLayer(mechMarker); mechMarker = null; fitted = false; map.setView(pickup, 15);
        }

        $('provider').hidden = !p;
        if (p) {
          $('p-name').textContent = 'ช่าง' + p.nickname;
          $('p-stats').textContent = (p.ratingCount > 0 ? '★ ' + p.ratingAvg.toFixed(1) + ' (' + p.ratingCount + ' รีวิว) · ' : '')
            + 'งานสำเร็จ ' + p.completedJobs + ' งาน';
          $('p-verified').hidden = !p.verified;
          if (p.photoUrl) $('p-photo').src = p.photoUrl;
          $('p-vehicle-row').hidden = !(p.vehicleDesc || p.vehiclePlate);
          $('p-vehicle').textContent = p.vehicleDesc ? 'รถของช่าง: ' + p.vehicleDesc : 'ทะเบียนรถของช่าง';
          $('p-plate').hidden = !p.vehiclePlate;
          $('p-plate').textContent = p.vehiclePlate || '';
        }
        if (d.status === 'COMPLETED' || d.status === 'CANCELLED') clearInterval(timer);
      }

      function load() {
        fetch(api + '/api/public/track/' + encodeURIComponent(token), { cache: 'no-store' })
          .then(function (res) {
            if (res.status === 404) throw new Error('ลิงก์นี้หมดอายุหรือถูกยกเลิกแล้ว');
            if (!res.ok) throw new Error('โหลดข้อมูลไม่สำเร็จ กำลังลองใหม่…');
            return res.json();
          })
          .then(render)
          .catch(function (err) {
            if (!map || /หมดอายุ/.test(err.message)) showError(err.message);
          });
      }

      if (!/^[A-Za-z0-9_-]{43}$/.test(token)) { showError('ลิงก์ไม่ถูกต้อง'); return; }
      load();
      timer = setInterval(load, 10000);
    })();
  </script>
</body>
</html>
