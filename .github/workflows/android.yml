name: Android build

# build APK (ติดตั้งทดสอบ) และ AAB (อัปโหลด Google Play) ของทั้งสองแอป
# ตั้งค่าใน Settings > Secrets and variables > Actions ดู docs/BUILD.md
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        app: [customer, provider]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Release keystore (ถ้ามี secret)
        env:
          KEYSTORE_BASE64: ${{ matrix.app == 'customer' && secrets.ANDROID_CUSTOMER_KEYSTORE_BASE64 || secrets.ANDROID_PROVIDER_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ matrix.app == 'customer' && secrets.ANDROID_CUSTOMER_KEYSTORE_PASSWORD || secrets.ANDROID_PROVIDER_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ matrix.app == 'customer' && secrets.ANDROID_CUSTOMER_KEY_ALIAS || secrets.ANDROID_PROVIDER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ matrix.app == 'customer' && secrets.ANDROID_CUSTOMER_KEY_PASSWORD || secrets.ANDROID_PROVIDER_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ไม่มี keystore: เซ็นด้วย debug key (ติดตั้งทดสอบได้ อัปโหลด Play ไม่ได้)"
            echo "BUILD_LABEL=-debug-signed" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build APK + AAB
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_ANDROID_APP_ID: ${{ matrix.app == 'customer' && vars.FIREBASE_CUSTOMER_ANDROID_APP_ID || vars.FIREBASE_PROVIDER_ANDROID_APP_ID }}
          SENTRY_DSN: ${{ matrix.app == 'customer' && vars.SENTRY_CUSTOMER_DSN || vars.SENTRY_PROVIDER_DSN }}
        run: |
          # ไม่ตั้ง API_BASE_URL แอปจะชี้ http://10.0.2.2:3000 (emulator) ใช้บนมือถือจริงไม่ได้
          # ติดชื่อ artifact ให้เห็นชัดว่าไม่ใช่ build สำหรับแจกผู้ใช้
          if [ -z "$API_BASE_URL" ]; then
            echo "::warning::ไม่ได้ตั้ง vars.API_BASE_URL: build นี้ต่อ API บนมือถือจริงไม่ได้"
            echo "BUILD_LABEL=${BUILD_LABEL:-}-no-api-url" >> "$GITHUB_ENV"
          elif [[ "$API_BASE_URL" != https://* ]]; then
            echo "::error::API_BASE_URL ต้องขึ้นต้นด้วย https:// (Android release ไม่อนุญาต http)"
            exit 1
          fi
          if [ -z "$FIREBASE_PROJECT_ID" ] || [ -z "$FIREBASE_ANDROID_APP_ID" ]; then
            echo "::warning::ไม่ได้ตั้งค่า Firebase: build นี้ไม่มีแจ้งเตือน push"
          fi
          defines=""
          for name in API_BASE_URL FIREBASE_PROJECT_ID FIREBASE_SENDER_ID FIREBASE_API_KEY FIREBASE_ANDROID_APP_ID SENTRY_DSN; do
            value="$(printenv "$name" || true)"
            [ -n "$value" ] && defines="$defines --dart-define=$name=$value"
          done
          build_number=$((GITHUB_RUN_NUMBER + 100))
          flutter build apk --release --build-number=$build_number $defines
          flutter build appbundle --release --build-number=$build_number $defines

      - uses: actions/upload-artifact@v4
        with:
          name: fixgo-${{ matrix.app }}-android${{ env.BUILD_LABEL }}
          retention-days: 14
          path: |
            apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
            apps/${{ matrix.app }}/build/app/outputs/bundle/release/app-release.aab
