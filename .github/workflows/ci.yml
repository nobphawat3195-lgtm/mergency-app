name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyze shared package
        working-directory: packages/fixgo_core
        run: flutter pub get && flutter analyze
      - name: Analyze customer app
        working-directory: apps/customer
        run: flutter pub get && flutter analyze
      - name: Analyze provider app
        working-directory: apps/provider
        run: flutter pub get && flutter analyze
